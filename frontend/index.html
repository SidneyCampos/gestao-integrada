<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <!-- Tags modernas para PWA no iOS/Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pref Hub" />
    <link rel="apple-touch-icon" href="/logo-circular.png" />
    <title>Prefeitura Hub</title>

    <style>
      /* ESTILOS DA TELA DE CARREGAMENTO (SPLASH SCREEN) */
      body {
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
      }
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0f172a; /* Azul escuro corporativo */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition:
          opacity 0.6s ease-out,
          visibility 0.6s ease-out;
      }
      .loader {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-top-color: #3b82f6; /* Azul claro rodando */
        animation: spin 1s ease-in-out infinite;
        margin-bottom: 24px;
      }
      .brand-text {
        color: white;
        font-family: sans-serif;
        font-weight: bold;
        letter-spacing: 3px;
        font-size: 14px;
        opacity: 0.9;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .esconder-splash {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <!-- TELA QUE APARECE ENQUANTO O REACT CARREGA -->
    <div id="splash-screen">
      <div class="loader"></div>
      <div class="brand-text">PREFEITURA HUB</div>
    </div>

    <!-- O SISTEMA REAL ENTRA AQUI -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      // // Remove a tela azul 1 segundo após o sistema carregar
      // window.addEventListener("load", () => {
      //   setTimeout(() => {
      //     document
      //       .getElementById("splash-screen")
      //       .classList.add("esconder-splash");
      //   }, 2000);
      // });

      // Registro do Service Worker Exigido pelo Google para PWA
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then(registration => {
              console.log("PWA: Service Worker registrado com sucesso.", registration.scope);
            })
            .catch(error => {
              console.error("PWA: Falha ao registrar Service Worker.", error);
            });
        });
      }
    </script>
  </body>
</html>
